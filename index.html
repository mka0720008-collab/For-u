<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Special Birthday Surprise 🎂</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ffd1dc, #fce4ec, #f8bbd0);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    /* Square Card Box */
    .card-box {
      background: #ffffff;
      width: 360px;
      height: 360px;
      padding: 2rem 1.5rem;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(225, 29, 72, 0.15);
      border: 1px solid rgba(255, 228, 230, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    h1 {
      font-size: 1.5rem;
      color: #e11d48;
      margin-bottom: 0.3rem;
    }

    p.subtitle {
      color: #777;
      font-size: 0.85rem;
      margin-bottom: 1.2rem;
    }

    .input-field {
      width: 100%;
      padding: 10px 14px;
      font-size: 0.95rem;
      border: 2px solid #fecdd3;
      border-radius: 12px;
      outline: none;
      margin-bottom: 0.75rem;
      text-align: center;
      transition: border-color 0.2s ease;
    }

    .input-field:focus {
      border-color: #e11d48;
    }

    .btn-submit {
      background: linear-gradient(45deg, #ff6b8b, #ff8e53);
      color: white;
      border: none;
      padding: 11px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      width: 100%;
      margin-top: 0.2rem;
      box-shadow: 0 4px 15px rgba(255, 107, 139, 0.35);
      transition: transform 0.15s ease;
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .error-msg {
      color: #e11d48;
      font-size: 0.78rem;
      margin-top: 0.5rem;
      display: none;
      font-weight: 500;
    }

    /* Reveal Screen */
    #birthdayContent {
      display: none;
      animation: fadeIn 0.8s ease-in-out forwards;
      overflow-y: auto;
    }

    #birthdayContent h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    #birthdayContent p {
      font-size: 0.9rem;
      line-height: 1.5;
      color: #4a4a4a;
      margin-bottom: 1rem;
    }

    /* Wrong credentials shake animation */
    .shake {
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- SQUARE LOGIN CARD -->
  <div class="card-box" id="loginBox">
    <h1>Restricted Access 🔐</h1>
    <p class="subtitle">Please authenticate to reveal the message</p>

    <input type="text" id="idInput" class="input-field" placeholder="Login ID" autocomplete="off" />
    <input type="password" id="passInput" class="input-field" placeholder="Password" />

    <button class="btn-submit" onclick="checkCredentials()">Enter ✨</button>
    <div class="error-msg" id="errorMsg">Incorrect ID or Password. Try again! 👀</div>
  </div>

  <!-- SQUARE BIRTHDAY REVEAL CARD -->
  <div class="card-box" id="birthdayContent">
    <h1>Happy Birthday, Luna! 🎉</h1>
    <p style="color: #e11d48; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.5rem;">Access Granted ✨</p>
    <p>
      Wishing you a day filled with laughter, happiness, and all your favorite things. May this year ahead bring you endless success and joy!
    </p>
    <button class="btn-submit" onclick="popConfetti()">More Confetti 🎊</button>
  </div>

  <script>
    const VALID_ID = "Luna";
    const VALID_PASS = "7815831798";

    function checkCredentials() {
      const user = document.getElementById('idInput').value.trim();
      const pass = document.getElementById('passInput').value.trim();
      const error = document.getElementById('errorMsg');
      const loginBox = document.getElementById('loginBox');

      // Check if credentials match (ID is case-insensitive)
      if (user.toLowerCase() === VALID_ID.toLowerCase() && pass === VALID_PASS) {
        loginBox.style.display = 'none';
        document.getElementById('birthdayContent').style.display = 'flex';
        popConfetti();
      } else {
        error.style.display = 'block';
        loginBox.classList.add('shake');
        setTimeout(() => loginBox.classList.remove('shake'), 400);
      }
    }

    function popConfetti() {
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 }
      });
    }

    // Allow submission with Enter key
    document.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        checkCredentials();
      }
    });
  </script>
</body>
</html>
